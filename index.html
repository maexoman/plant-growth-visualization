<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/style.css">
  <title>plant-growth-visual</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="flex h-full">
  <div class="relative inline-block h-full">
    <div class="absolute flex justify-center w-full h-32 opacity-0">
      <input type="range" id="sld-sun" value="0" min="-100" max="100" class="cursor-pointer w-3/4 h-full large-slider">
    </div>

    <canvas id="canvas" width="960" height="1080" class="h-full w-auto border-r-4"></canvas>
    <canvas id="ghost-canvas" width="960" height="1080"
      class="absolute top-0 left-0 opacity-50 hidden pointer-events-none h-full w-auto"></canvas>
    <div id="dead-x" class="absolute justify-center top-2/3 left-0 right-0 bottom-0 hidden pointer-events-none">
      <svg xmlns:svg="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" version="1.0" width="100"
        height="100" id="svg8978">
        <defs id="defs8980" />
        <g id="layer1">
          <path d="M 6.3895625,6.4195626 C 93.580437,93.610437 93.580437,93.610437 93.580437,93.610437"
            style="fill:none;fill-rule:evenodd;stroke:#ff0000;stroke-width:18.05195999;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1"
            id="path8986" />
          <path d="M 6.3894001,93.6106 C 93.830213,6.4194003 93.830213,6.4194003 93.830213,6.4194003"
            style="fill:none;fill-rule:evenodd;stroke:#ff0000;stroke-width:17.80202103;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1"
            id="path8988" />
        </g>
      </svg>
    </div>
    <div class="absolute bottom-4 right-4 px-4 py-2 border bg-white rounded-md">
      <i class="fa-regular fa-calendar"></i>
      <span id="day-counter">0</span>
    </div>
  </div>
  <div class="flex flex-1 flex-col p-4 justify-center">
    <h1 class="text-2xl font-extrabold pb-2">Einstellungen</h1>
    <table class="w-full">
      <tbody class="w-full gap-2">
        <tr>
          <td>Gravitation: </td>
          <td>
            <input type="range" id="sld-gravity" min="0" max="10" step="1">
          </td>
          <td class="text-right" id="gravitation"></td>
        </tr>
        <tr class="w-full">
          <td colspan="3">
            <div class="flex gap-2 justify-between mb-4">
              <button id="btn-zerog" class="flex-1 border-black border w-1/2 p-1.5 cursor-pointer rounded-md"><i
                  class="fa-solid fa-user-astronaut"></i> Schweerelos</button>
              <button id="btn-mars"
                class="flex-1  border-black border w-1/2 p-1.5 cursor-pointer rounded-md">Mars</button>
              <button id="btn-earth" class="flex-1  border-black border w-1/2 p-1.5 cursor-pointer rounded-md"><i
                  class="fa-solid fa-earth-europe"></i> Erde</button>
            </div>
          </td>
        </tr>
        <tr>
          <td>Licht: </td>
          <td><input type="range" id="sld-sun-hours" min="0" max="4" step="1"></td>
          <td class="text-right" id="light"></td>
        </tr>
        <tr>
          <td>Temperatur: </td>
          <td><input type="range" id="sld-temperature" min="0" max="4" step="1"></td>
          <td class="text-right" id="temperature"></td>
        </tr>
        <tr>
          <td>Wasser: </td>
          <td><input type="range" id="sld-water" min="0" max="4" step="1"></td>
          <td class="text-right" id="water"></td>
        </tr>
        <tr>
          <td>Kohlenstoffdioxid: </td>
          <td><input type="range" id="sld-carbon-dioxide" min="0" max="4" step="1"></td>
          <td class="text-right" id="carbon-dioxide"></td>
        </tr>
        <tr>
          <td>Nährstoffe: </td>
          <td><input type="range" id="sld-nutrients" min="0" max="4" step="1"></td>
          <td class="text-right" id="nutrients"></td>
        </tr>
      </tbody>
    </table>
    <div class="flex gap-4 pt-4">
      <button id="btn-reset"
        class=" border-black bg-red-600 text-white  border w-full p-1.5 cursor-pointer rounded-md"><i
          class="fa-solid fa-rotate-left"></i> Reset</button>
      <button id="btn-pause"
        class="border-black bg-yellow-600 text-white hidden border w-full p-1.5 cursor-pointer rounded-md"><i
          class="fa-solid fa-pause"></i> Pause</button>
      <button id="btn-start"
        class="border-black bg-green-600 text-white border w-full p-1.5 cursor-pointer rounded-md"><i
          class="fa-solid fa-play"></i> Start</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
